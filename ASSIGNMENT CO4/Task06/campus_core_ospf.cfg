! Cisco Packet Tracer: CO4 Task 6 Reduced Campus Core + 2 Buildings + Dual ISP
! Core-SW-1 (L3 OSPF + Inter-VLAN Routing + Guest ACL)

enable
configure terminal
hostname CAMPUS-CORE-1
ip routing

vlan 10
 name Student
vlan 20
 name Staff
vlan 30
 name Guest
vlan 40
 name CCTV

interface Vlan10
 ip address 10.10.0.1 255.255.128.0
interface Vlan20
 ip address 10.10.128.1 255.255.224.0
interface Vlan30
 ip address 10.10.160.1 255.255.240.0
 ip access-group GUEST_ISOLATION in
interface Vlan40
 ip address 10.10.176.1 255.255.240.0

interface GigabitEthernet0/1
 description Redundant Trunk to Labs Distribution
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown

interface GigabitEthernet0/2
 description Redundant Trunk to Hostels Distribution
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown

interface GigabitEthernet0/3
 description Cross-link to CAMPUS-CORE-2
 no switchport
 ip address 10.255.0.1 255.255.255.252
 no shutdown

ip access-list extended GUEST_ISOLATION
 deny ip 10.10.160.0 0.0.15.255 10.10.0.0 0.0.255.255
 permit ip 10.10.160.0 0.0.15.255 any

router ospf 1
 router-id 10.255.255.1
 auto-cost reference-bandwidth 100000
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.0.0 0.0.0.3 area 0
 default-information originate

ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 0.0.0.0 0.0.0.0 198.51.100.1 200

end
write memory
show ip route
show vlan brief
