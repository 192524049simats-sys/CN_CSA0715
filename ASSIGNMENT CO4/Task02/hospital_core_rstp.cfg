! Cisco Packet Tracer: CO4 Task 2 Hospital Resilient Hybrid/Ring Core Switch Config
! Switches: SW-DC (Data Centre), SW-EMERG (Emergency), SW-OT (Operation Theatres)
! RSTP ensures <1 s failover when any one core fibre link is cut/shut down.

enable
configure terminal
hostname SW-DC
spanning-tree mode rapid-pvst
spanning-tree vlan 1 root primary

interface GigabitEthernet0/1
 description Fibre Trunk to Emergency Block
 switchport mode trunk
 no shutdown

interface GigabitEthernet0/2
 description Fibre Trunk to Operation Theatres
 switchport mode trunk
 no shutdown

interface GigabitEthernet0/3
 description Fibre to Outpatient / Lab / Admin
 switchport mode trunk
 no shutdown

interface Vlan1
 ip address 10.20.0.1 255.255.255.0
 no shutdown

end
write memory
show spanning-tree summary
show interfaces trunk
