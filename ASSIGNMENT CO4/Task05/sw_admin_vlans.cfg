! Cisco Packet Tracer: VLANs on the access switch of the Admin block (SW-Admin).
enable
configure terminal
hostname SW-Admin
vlan 10
 name Office
vlan 20
 name CCTV
! TODO 1: Create VLAN 30 named Guest-WiFi
vlan 30
 name Guest-WiFi

interface range FastEthernet0/1 - 12
 switchport mode access
 switchport access vlan 10
! TODO 2: Put ports Fa0/13 - 20 in VLAN 20 and ports Fa0/21 - 24 in VLAN 30 as access
! ports
interface range FastEthernet0/13 - 20
 switchport mode access
 switchport access vlan 20
interface range FastEthernet0/21 - 24
 switchport mode access
 switchport access vlan 30

! TODO 3: Make GigabitEthernet0/1 an 802.1Q trunk to the core switch that carries only
! VLANs 10, 20 and 30
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown

end
write memory
show vlan brief
show interfaces trunk
