! Cisco IOS Configuration for CO1 Task 12 (revised.pkt)
! Core L3 Switch + VLANs + DiffServ EF QoS + LACP EtherChannel

enable
configure terminal
hostname CORE-SW-PLANT
ip routing

vlan 10
 name AGV_5G_URLLC
vlan 20
 name FIXED_ROBOTS
vlan 30
 name CCTV_SURVEILLANCE
vlan 40
 name OFFICE_WIFI6
vlan 50
 name VIBRATION_SENSORS

class-map match-any CM-URLLC
 match access-group name ACL-ROBOT-AGV
class-map match-any CM-CCTV
 match access-group name ACL-CCTV

policy-map PM-PLANT-QOS
 class CM-URLLC
  priority percent 30
  set dscp ef
 class CM-CCTV
  bandwidth percent 40
  set dscp af41
 class class-default
  fair-queue

ip access-list extended ACL-ROBOT-AGV
 permit ip 10.10.10.0 0.0.0.255 any
 permit ip 10.10.20.0 0.0.0.255 any
ip access-list extended ACL-CCTV
 permit ip 10.10.30.0 0.0.0.255 any

interface Port-channel1
 description 2x10G LACP Trunk to Shop-Floor Distribution
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50
 service-policy output PM-PLANT-QOS

interface range GigabitEthernet0/1 - 2
 channel-group 1 mode active
 no shutdown

interface Vlan10
 ip address 10.10.10.1 255.255.255.0
interface Vlan20
 ip address 10.10.20.1 255.255.255.0
interface Vlan30
 ip address 10.10.30.1 255.255.255.0
interface Vlan40
 ip address 10.10.40.1 255.255.255.0
interface Vlan50
 ip address 10.10.50.1 255.255.255.0

end
write memory
show vlan brief
show etherchannel summary
show policy-map interface Port-channel1
