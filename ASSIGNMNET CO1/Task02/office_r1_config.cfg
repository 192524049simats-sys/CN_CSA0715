! Cisco IOS Configuration for CO1 Task 2 (office.pkt)
! Contractor's Office Topology: Router R1 + Switch1 (24-port) + Switch2 (IP Phones)
! Apply on Router R1 in Cisco Packet Tracer 9.0.0

enable
configure terminal
hostname R1-Office
no ip domain-lookup

interface GigabitEthernet0/0
 description LAN to 24-Port Switch1 (3 Hubs / 24 Office PCs)
 ip address 192.168.10.1 255.255.255.0
 no shutdown

interface GigabitEthernet0/1
 description Voice LAN to Switch2 (12 IP Phones)
 ip address 192.168.20.1 255.255.255.0
 no shutdown

ip dhcp pool OFFICE_DATA
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8

ip dhcp pool VOICE_PHONES
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 option 150 ip 192.168.20.1

end
write memory
show ip interface brief
show ip route
