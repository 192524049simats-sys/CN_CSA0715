! Cisco Packet Tracer: Q7 Redesigned District Network (OSPF replacing RIPv2 on Router A)
! Link costs: A-B=2, A-C=7, B-C=3

enable
configure terminal
hostname Router-A
no router rip

interface GigabitEthernet0/0
 description Link A-B (cost 2)
 ip address 10.0.12.1 255.255.255.252
 ip ospf cost 2
 no shutdown

interface GigabitEthernet0/1
 description Link A-C (cost 7)
 ip address 10.0.13.1 255.255.255.252
 ip ospf cost 7
 no shutdown

router ospf 1
 router-id 1.1.1.1
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.13.0 0.0.0.3 area 0

end
write memory
show ip ospf neighbor
show ip route ospf
