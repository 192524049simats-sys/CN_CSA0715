! Cisco Packet Tracer: OSPF with auto-cost reference-bandwidth 100000 (100 Gbps)
! Apply on all 6 ISP routers (example shown for R1)

enable
configure terminal
hostname ISP-R1
interface GigabitEthernet0/0
 description 1 Gbps Link to R2
 bandwidth 1000000
 ip address 10.12.0.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description 10 Gbps Link to R3
 bandwidth 10000000
 ip address 10.13.0.1 255.255.255.252
 no shutdown

router ospf 1
 router-id 1.1.1.1
 auto-cost reference-bandwidth 100000
 network 10.12.0.0 0.0.0.3 area 0
 network 10.13.0.0 0.0.0.3 area 0

end
write memory
show ip ospf interface
show ip route ospf
