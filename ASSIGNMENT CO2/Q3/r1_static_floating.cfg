! Cisco Packet Tracer: Static & Floating Static Routing on R1 (Main Campus)
! R1 LAN 192.168.10.0/24 on G0/0, R2 LAN 192.168.20.0/24
! Primary serial link 10.0.0.0/30 (S0/0/0), Backup link 10.0.0.4/30 (G0/1)

enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.10.1 255.255.255.0
 no shutdown
! TODO 1: Configure Serial0/0/0 with 10.0.0.1/30, set the clock rate to 64000 (R1 is the
! DCE end) and bring it up
interface Serial0/0/0
 ip address 10.0.0.1 255.255.255.252
 clock rate 64000
 no shutdown
exit
! Backup link interface for floating static failover
interface GigabitEthernet0/1
 ip address 10.0.0.5 255.255.255.252
 no shutdown
exit
! TODO 2: Add a static route to the City campus LAN 192.168.20.0/24 through the next hop
! 10.0.0.2
ip route 192.168.20.0 255.255.255.0 10.0.0.2
! Floating static backup route (Administrative Distance = 200)
ip route 192.168.20.0 255.255.255.0 10.0.0.6 200
end
write memory
show ip route
