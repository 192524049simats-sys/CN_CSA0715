! Cisco Packet Tracer: Reverse Static & Floating Static Routing on R2 (City Campus)
! R2 LAN 192.168.20.0/24 on G0/0, Primary serial link 10.0.0.0/30 (S0/0/0, DTE)
! Backup link 10.0.0.4/30 (G0/1)

enable
configure terminal
hostname R2
interface GigabitEthernet0/0
 ip address 192.168.20.1 255.255.255.0
 no shutdown
interface Serial0/0/0
 ip address 10.0.0.2 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/1
 ip address 10.0.0.6 255.255.255.252
 no shutdown
exit
! Primary static route back to Main campus LAN 192.168.10.0/24
ip route 192.168.10.0 255.255.255.0 10.0.0.1
! Floating static backup route (AD = 200)
ip route 192.168.10.0 255.255.255.0 10.0.0.5 200
end
write memory
show ip route
